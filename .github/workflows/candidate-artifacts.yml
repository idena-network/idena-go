name: Build candidate artifacts

on:
  pull_request:
    paths:
      - .github/workflows/candidate-artifacts.yml
      - compatibility/stack-lock.json
      - go.mod
      - go.sum
      - vm/wasm/**
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without the leading v
        required: true
        default: 1.1.2-rkyv.1

permissions:
  contents: read

env:
  CANDIDATE_VERSION: ${{ inputs.version || '1.1.2-rkyv.1' }}

jobs:
  build:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux-x64
            os: ubuntu-24.04
            asset_prefix: idena-node-linux
            extension: ''
          - build: linux-arm64
            os: ubuntu-24.04-arm
            asset_prefix: idena-node-linux-aarch64
            extension: ''
          - build: windows-x64
            os: windows-2025
            asset_prefix: idena-node-win
            extension: .exe
          - build: macos-x64
            os: macos-15-intel
            asset_prefix: idena-node-mac
            extension: ''
          - build: macos-arm64
            os: macos-15
            asset_prefix: idena-node-mac-arm64
            extension: ''

    steps:
      - name: Get sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.3
          cache: true

      - name: Validate candidate version
        shell: bash
        env:
          VERSION: ${{ env.CANDIDATE_VERSION }}
        run: |
          if [[ ! "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Unsupported candidate version: ${VERSION}" >&2
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Build release-equivalent candidate
        shell: bash
        env:
          ASSET_PREFIX: ${{ matrix.asset_prefix }}
          EXTENSION: ${{ matrix.extension }}
          VERSION: ${{ env.CANDIDATE_VERSION }}
          CGO_ENABLED: 1
        run: |
          asset_name="${ASSET_PREFIX}-${VERSION}${EXTENSION}"
          mkdir -p builds
          go build -mod=readonly -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "builds/${asset_name}" .
          (cd builds && openssl dgst -sha256 -r "${asset_name}" | tr -d '\r' > "${asset_name}.sha256")

      - name: Upload candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.build }}
          path: builds/*
          if-no-files-found: error
          retention-days: 7
